version: '3.8'

# =============================================================================
# TEIA - Docker Compose Logging Override (Production)
# =============================================================================
# Uso:
#   docker-compose -f docker-compose.yml -f docker-compose.logging.yml up
#
# Configuração de logging drivers para integração com:
# - Grafana Loki (recomendado)
# - ELK Stack (Logstash/Elasticsearch)
# - Graylog (GELF)
# - Datadog
# =============================================================================

# Configuração base para logging drivers
# Descomente e configure APENAS UM dos blocos abaixo conforme sua stack

services:
  teia-backend:
    # ----------------------------------------------------------
    # OPÇÃO 1: Grafana Loki (Recomendado - nativo Docker)
    # ----------------------------------------------------------
    # logging:
    #   driver: loki
    #   options:
    #     loki-url: "http://loki:3100/loki/api/v1/push"
    #     loki-retries: "5"
    #     loki-batch-size: "400"
    #     loki-batch-wait: "1s"
    #     loki-timeout: "10s"
    #     # Labels para Loki (indexados, use com moderação - cardinalidade!)
    #     loki-external-labels: "app=teia,service=backend,environment=production"
    #     # Opcional: pipeline para extrair labels de JSON
    #     # loki-pipeline-stages: |
    #     #   - json:
    #     #       expressions:
    #     #         request_id: request_id
    #     #         user_id: user_id
    #     #         event: event
    #     #         status_code: status_code

    # ----------------------------------------------------------
    # OPÇÃO 2: ELK Stack (Logstash via TCP/UDP)
    # ----------------------------------------------------------
    # logging:
    #   driver: syslog
    #   options:
    #     syslog-address: "tcp://logstash:5000"
    #     syslog-format: "rfc5424"
    #     tag: "teia-backend"
    #     # Para JSON direto no Logstash, use logstash driver (requer plugin)
    #     # driver: logstash
    #     # options:
    #     #   logstash-address: "tcp://logstash:5000"

    # ----------------------------------------------------------
    # OPÇÃO 3: Graylog (GELF)
    # ----------------------------------------------------------
    # logging:
    #   driver: gelf
    #   options:
    #     gelf-address: "udp://graylog:12201"
    #     gelf-compression-type: "gzip"
    #     gelf-compression-level: "6"
    #     tag: "teia-backend"
    #     # Labels adicionais
    #     gelf-additional-fields: "app=teia,service=backend,environment=production"

    # ----------------------------------------------------------
    # OPÇÃO 4: Datadog
    # ----------------------------------------------------------
    # logging:
    #   driver: json-file  # Datadog agent lê arquivos
    #   options:
    #     max-size: "10m"
    #     max-file: "5"
    #     # Datadog agent config (datadog.yaml) deve ter:
    #     # logs_enabled: true
    #     # container_collect_all: true
    #     #   auto_multi_line_detection: true

    # ----------------------------------------------------------
    # OPÇÃO 5: JSON File (Fallback - rotação local)
    # ----------------------------------------------------------
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
        compress: "true"

  teia-frontend:
    # Frontend (Nginx) - logs de acesso em JSON
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
        compress: "true"

