services:
  teia-backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: runtime
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1
      - PYTHONDONTWRITEBYTECODE=1
      - DJANGO_SETTINGS_MODULE=TCC_DjangoScrumKipo.settings
    ports:
      - "8000:8000"
    volumes:
      - dados_db:/app/database
      - static_files:/app/staticfiles
      - media_files:/app/kipo_playground/media
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health/"]
      interval: 30s
      timeout: 15s
      retries: 5
      start_period: 60s
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
        compress: "true"

  teia-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: runtime
    env_file:
      - .env.frontend
    ports:
      - "3000:8080"
    depends_on:
      teia-backend:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 15s
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
        compress: "true"

volumes:
  dados_db:
    driver: local
  static_files:
    driver: local
  media_files:
    driver: local

networks:
  default:
    name: teia-network
    driver: bridge
