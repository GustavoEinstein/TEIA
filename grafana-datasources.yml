# Grafana Datasources Provisioning for TEIA
# Coloque em: /etc/grafana/provisioning/datasources/datasources.yml
# Referência: https://grafana.com/docs/grafana/latest/administration/provisioning/

apiVersion: 1

datasources:
  # ------------------------------------------------------------------
  # Loki - Logs estruturados
  # ------------------------------------------------------------------
  - name: Loki-TEIA
    type: loki
    access: proxy
    url: http://loki:3100
    isDefault: true
    jsonData:
      maxLines: 1000
      derivedFields:
        # Link para traces no Tempo (se usar)
        - name: traceID
          matcherRegex: "trace_id=([a-f0-9]+)"
          url: "http://tempo:3200/tempo/trace/${__value.raw}"
          datasourceUid: Tempo-TEIA
    editable: false

  # ------------------------------------------------------------------
  # Prometheus - Métricas (se usar)
  # ------------------------------------------------------------------
  - name: Prometheus-TEIA
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: false
    jsonData:
      timeInterval: 30s
      queryTimeout: 60s
    editable: false

  # ------------------------------------------------------------------
  # Tempo - Distributed Tracing (opcional)
  # ------------------------------------------------------------------
  - name: Tempo-TEIA
    type: tempo
    access: proxy
    url: http://tempo:3200
    isDefault: false
    jsonData:
      tracesToLogs:
        datasourceUid: Loki-TEIA
        tags: ['service', 'service.name', 'service.namespace']
        spanStartTimeShift: 1h
        spanEndTimeShift: 1h
      serviceMap:
        datasourceUid: Prometheus-TEIA
    editable: false