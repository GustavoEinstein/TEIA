# Logstash Pipeline for TEIA
# Input: Docker logs via syslog/TCP
# Output: Elasticsearch
# Referência: https://www.elastic.co/guide/en/logstash/current/configuration.html

input {
  # Opção 1: Syslog (RFC5424) - compatível com docker syslog driver
  tcp {
    port => 5000
    codec => "json_lines"
    type => "teia-docker"
  }

  # Opção 2: Beats (Filebeat/Journalbeat)
  # beats {
  #   port => 5044
  # }

  # Opção 3: HTTP (para envio direto)
  # http {
  #   port => 8080
  # }
}

filter {
  # Parse do timestamp ISO 8601
  date {
    match => ["timestamp", "ISO8601"]
    target => "@timestamp"
    remove_field => ["timestamp"]
  }

  # Parse do nível de log
  mutate {
    uppercase => ["level"]
  }

  # Extrair campos estruturados do Django
  if [logger] =~ /^kipo_playground/ {
    # request_id já vem no JSON
    # user_id já vem no JSON
    # event já vem no JSON
    # status_code já vem no JSON
    # duration_ms já vem no JSON

    # Adicionar tags para facilitar buscas
    mutate {
      add_tag => ["django", "teia"]
    }
  }

  # Parse de exceções (stack traces)
  if [exception] {
    mutate {
      add_tag => ["exception"]
    }
  }

  # Nginx access logs
  if [service] == "frontend" {
    # request_time já vem como número
    # status já vem como número
    mutate {
      add_tag => ["nginx", "access"]
    }
  }

  # GeoIP (opcional - requer database)
  # geoip {
  #   source => "remote_addr"
  #   target => "geoip"
  #   database => "/usr/share/logstash/GeoLite2-City.mmdb"
  # }

  # User Agent parsing (opcional)
  # useragent {
  #   source => "http_user_agent"
  #   target => "ua"
  # }

  # Remover campos sensíveis se existirem
  mutate {
    remove_field => ["password", "token", "authorization", "cookie", "secret"]
  }
}

output {
  # Elasticsearch
  elasticsearch {
    hosts => ["elasticsearch:9200"]
    index => "teia-logs-%{+YYYY.MM.dd}"
    # Template para mapeamento correto
    template => "/usr/share/logstash/templates/teia-logs.json"
    template_name => "teia-logs"
    template_overwrite => true
    # Pipeline para processamento adicional no ES
    # pipeline => "teia-logs-pipeline"
    # Credenciais (se necessário)
    # user => "elastic"
    # password => "${ELASTIC_PASSWORD}"
    # SSL
    # ssl => true
    # ssl_certificate_verification => false
  }

  # Debug (stdout) - remover em produção
  # stdout {
  #   codec => rubydebug
  # }

  # Dead letter queue para falhas
  # dead_letter_queue => {
  #   path => "/usr/share/logstash/data/dead_letter_queue"
  # }
}