# Loki Configuration for TEIA
# Referência: https://grafana.com/docs/loki/latest/configuration/

auth_enabled: false

server:
  http_listen_port: 3100
  grpc_listen_port: 9096

common:
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    instance_addr: 127.0.0.1
    kvstore:
      store: inmemory

query_scheduler:
  max_outstanding_requests_per_tenant: 1000

limits_config:
  # Retenção de logs (30 dias padrão)
  retention_period: 720h  # 30 dias
  # Tamanho máximo de linha (10MB)
  max_line_size: 10485760
  # Rejeitar logs muito antigos (mais de 30 dias)
  reject_old_samples: true
  reject_old_samples_max_age: 720h
  # Cardinalidade de labels (cuidado com request_id!)
  max_label_names_per_series: 20
  max_label_value_length: 1024
  # Rate limiting por tenant
  ingestion_rate_mb: 20
  ingestion_burst_size_mb: 50

schema_config:
  configs:
    - from: 2024-01-01
      store: boltdb-shipper
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

# Ruler para alertas (opcional)
ruler:
  storage:
    type: local
    local:
      directory: /loki/rules
  rule_path: /loki/rules-temp
  alertmanager_url: http://alertmanager:9093

# Analytics (opcional)
analytics:
  reporting_enabled: false