# Promtail Configuration for TEIA
# Ship Docker container logs to Loki
# Referência: https://grafana.com/docs/loki/latest/clients/promtail/

server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push
    batchwait: 1s
    batchsize: 102400
    timeout: 10s

scrape_configs:
  # ------------------------------------------------------------------
  # Docker containers (TEIA backend/frontend)
  # ------------------------------------------------------------------
  - job_name: teia-containers
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 10s
        filters:
          - name: label
            values: ["com.docker.compose.project=teia"]
    relabel_configs:
      # Extrair labels do Docker
      - source_labels: ['__meta_docker_container_name']
        target_label: 'container'
      - source_labels: ['__meta_docker_container_label_com_docker_compose_service']
        target_label: 'service'
      - source_labels: ['__meta_docker_container_label_com_docker_compose_project']
        target_label: 'project'
      # Filtrar apenas containers TEIA
      - source_labels: ['__meta_docker_container_label_com_docker_compose_project']
        regex: 'teia'
        action: keep
      # Remover labels internos do Docker (cardinalidade!)
      - action: labeldrop
        regex: '__meta_docker_.*'
    pipeline_stages:
      # Parse JSON logs do Django (structured logging)
      - json:
          expressions:
            timestamp: timestamp
            level: level
            logger: logger
            message: message
            request_id: request_id
            user_id: user_id
            event: event
            status_code: status_code
            duration_ms: duration_ms
            method: method
            path: path
      # Usar timestamp do log se disponível
      - timestamp:
          source: timestamp
          format: RFC3339Nano
      # Labels indexados (CUIDADO: baixa cardinalidade!)
      - labels:
          level:
          service:
          project:
          event:
      # Labels não indexados (structured metadata)
      - structured_metadata:
          request_id:
          user_id:
          logger:
          method:
          path:
          status_code:
          duration_ms:

  # ------------------------------------------------------------------
  # Nginx access logs (frontend)
  # ------------------------------------------------------------------
  - job_name: teia-nginx
    static_configs:
      - targets:
          - localhost
        labels:
          job: teia-nginx
          service: frontend
          project: teia
          __path__: /var/log/nginx/access.log
    pipeline_stages:
      # Parse nginx JSON log format
      - json:
          expressions:
            remote_addr: remote_addr
            time_local: time_local
            request: request
            status: status
            body_bytes_sent: body_bytes_sent
            http_referer: http_referer
            http_user_agent: http_user_agent
            request_time: request_time
      - labels:
          status:
      - structured_metadata:
          remote_addr:
          request:
          body_bytes_sent:
          http_referer:
          http_user_agent:
          request_time:

  # ------------------------------------------------------------------
  # System logs (opcional)
  # ------------------------------------------------------------------
  - job_name: teia-system
    static_configs:
      - targets:
          - localhost
        labels:
          job: teia-system
          project: teia
          __path__: /var/log/syslog